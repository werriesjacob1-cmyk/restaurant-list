name: board-watch
on:
  schedule:
    - cron: "*/5 11-23,0-1 * * 1-5"   # weekdays, every 5 min, ~5 AM-8 PM Central
    - cron: "7 12-23,0-1 * * 0,6"     # weekends, hourly
  workflow_dispatch:
    inputs:
      selftest:
        description: "1. TEST ALERT: send one test notification to my phone"
        type: boolean
        default: false
      detail:
        description: "2. READ FULL POSTINGS: pay, travel, schedule for my watch list (no alerts)"
        type: boolean
        default: false
      probe:
        description: "3. FIND BOARDS: look up job boards for companies the repo cannot read (no alerts)"
        type: boolean
        default: false
      qualify:
        description: "5. DEEP QUALIFY: read every full posting and score it against my Tier 1 rule (no alerts)"
        type: boolean
        default: false
      audit:
        description: "4. COVERAGE CHECK: what the repo matches and skips (no alerts)"
        type: boolean
        default: false
concurrency:
  group: board-watch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test
        if: ${{ github.event.inputs.selftest == 'true' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py --selftest
      - name: Poll boards and alert
        if: ${{ github.event.inputs.selftest != 'true' && github.event.inputs.audit != 'true' && github.event.inputs.detail != 'true' && github.event.inputs.probe != 'true' && github.event.inputs.qualify != 'true' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python watch.py
      - name: Detail audit
        if: ${{ github.event.inputs.detail == 'true' }}
        run: python watch.py --detail
      - name: Probe
        if: ${{ github.event.inputs.probe == 'true' }}
        run: python watch.py --probe
      - name: Deep qualify
        if: ${{ github.event.inputs.qualify == 'true' }}
        run: python watch.py --qualify
      - name: Audit
        if: ${{ github.event.inputs.audit == 'true' }}
        run: python watch.py --audit
      - name: Save state
        if: ${{ github.event.inputs.selftest != 'true' && github.event.inputs.audit != 'true' && github.event.inputs.detail != 'true' && github.event.inputs.probe != 'true' && github.event.inputs.qualify != 'true' }}
        run: |
          git config user.name "board-watch"
          git config user.email "board-watch@users.noreply.github.com"
          git add state.json auto_roster.json filtered_log.jsonl 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "state" && git pull --rebase -q && git push -q)
