name: f100-scan
on:
  push:
    branches: [nov17-verify]
    paths: [".github/workflows/f100-scan.yml", "f100_scan.py", "f100_list.json"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python f100_scan.py f100_list.json
