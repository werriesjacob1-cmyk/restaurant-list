name: fresh-pull
on:
  workflow_dispatch:
    inputs:
      days:
        default: "30"
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fresh_pull.py "${{ github.event.inputs.days }}"
